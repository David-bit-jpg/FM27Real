<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM27Real</title>
<style>
  :root {
    --bg: #121a30; --bg2: #1b2a4e; --panel: #1a2747; --line: #2c3d66; --text: #e8ecf4; --muted: #8ea0c8;
    --accent: #d6246e; --mine: #6a2fb8; --theirs: #25365f; --good: #3fbf7f; --bad: #e05561; --warn: #e3a33b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.45 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; color: var(--text);
         background: linear-gradient(180deg, var(--bg2), var(--bg)); display: flex; flex-direction: column;
         overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: var(--text); background: #0d1426; border: 1px solid var(--line);
                  border-radius: 8px; padding: 9px 11px; width: 100%; outline: none; }
  input:focus, select:focus { border-color: #4b67a8; }

  header.top { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header.top .title { font-weight: 650; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { background: none; border: 0; padding: 4px 8px; border-radius: 6px; color: var(--muted); font-size: 18px; }
  .iconbtn:hover { background: #ffffff12; color: var(--text); }
  .tabs { display: flex; gap: 4px; }
  .tab { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--muted); }
  .tab.on { background: #ffffff14; color: var(--text); }

  main { flex: 1; overflow: auto; }
  .banner { margin: 10px 14px 0; padding: 9px 12px; border-radius: 8px; background: #3a2a12; color: #f3d39b; font-size: 13px; }
  .banner.err { background: #3d1820; color: #f4b3bb; }
  .section { padding: 12px 14px 4px; color: var(--muted); font-size: 12px; letter-spacing: .04em; }

  .person { display: flex; align-items: center; gap: 11px; padding: 9px 14px; cursor: pointer; }
  .person:hover { background: #ffffff0d; }
  .person.unread .name::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                                background: var(--accent); margin-left: 7px; vertical-align: middle; }
  .badge { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 4px; border-radius: 8px;
           background: var(--accent); color: #fff; font-size: 11px; line-height: 16px; text-align: center; }
  .person .who { flex: 1; min-width: 0; }
  .person .name { font-weight: 600; }
  .person .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #2b3d6b; object-fit: cover;
            display: flex; align-items: center; justify-content: center; font-weight: 650; font-size: 14px; color: #cfd8ee; overflow: hidden; }
  .avatar.big { width: 58px; height: 58px; font-size: 18px; }

  .chat { display: flex; flex-direction: column; height: 100%; }
  .chat-head { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .chat-head .name { font-size: 16px; font-weight: 650; }
  .chat-head .sub { color: var(--muted); font-size: 12px; }
  .mood { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 10px; background: #ffffff12; color: var(--muted); font-size: 12px; }
  .fmtag { align-self: center; color: var(--muted); font-size: 11px; margin: 8px 0 0; letter-spacing: .03em; }
  .gesture { color: var(--muted); font-size: 12px; font-style: italic; margin: 4px 2px -2px; max-width: 82%; }
  .log { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: var(--theirs); white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; }
  .msg.them { border-bottom-left-radius: 4px; }
  .day { align-self: center; color: var(--muted); font-size: 11px; margin: 6px 0 2px; }
  .typing { color: var(--muted); font-size: 12px; padding: 0 2px; }
  .failed { align-self: flex-end; color: var(--bad); font-size: 12px; }
  .failed button { background: none; border: 0; color: var(--text); text-decoration: underline; padding: 0 4px; }
  form.send { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  form.send button { border: 0; border-radius: 8px; padding: 0 16px; background: var(--accent); color: #fff; font-weight: 650;
                     white-space: nowrap; flex: none; }
  form.send button:disabled { opacity: .5; cursor: default; }

  .settings { padding: 6px 14px 20px; }
  .field { margin: 12px 0; }
  .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
  .seg { display: inline-flex; background: #0d1426; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { background: none; border: 0; padding: 6px 14px; border-radius: 6px; color: var(--muted); }
  .seg button.on { background: #2b3d6b; color: var(--text); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .btn { border: 1px solid var(--line); background: #22335c; border-radius: 8px; padding: 9px 12px; white-space: nowrap; flex: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 650; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .ok { color: var(--good); } .bad { color: var(--bad); }
  .empty { color: var(--muted); padding: 30px 14px; text-align: center; }

  body.pressmode .tabs, body.pressmode #back { display: none; }
  .press { display: flex; flex-direction: column; height: 100%; }
  .press-head { display: flex; gap: 12px; align-items: center; padding: 14px; border-bottom: 1px solid var(--line); }
  .press-head .name { font-size: 16px; font-weight: 650; }
  .press-head .sub { color: var(--muted); font-size: 12px; }
  .press .q { margin: 14px; padding: 12px 14px; border-radius: 14px; background: #2f5fd0; color: #fff; font-size: 15px; line-height: 1.5; }
  .press .q.pending { opacity: .75; }
  .press .orig { margin: -6px 16px 8px; color: var(--muted); font-size: 11px; }
  .press .log { flex: 1; }
  .press .msg.j { background: #2f5fd0; color: #fff; }
  .press .done { align-self: center; color: var(--good); font-size: 12px; margin: 8px 0; }
  .press .foot { display: flex; justify-content: space-between; padding: 0 14px 10px; color: var(--muted); font-size: 12px; }
  .press .foot button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 12px; padding: 0; }
  .feed { padding: 4px 0 16px; }
  [hidden] { display: none !important; }
  .post { margin: 10px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
  .post.at { border-color: #d6246e88; }
  .post .head { display: flex; gap: 9px; align-items: center; padding: 9px 11px; }
  .post .head .avatar, .post .head .av { width: 34px; height: 34px; border-radius: 50%; object-fit: contain; background: #0d1426; }
  .av-txt { font-size: 13px; }
  .post .nm { font-weight: 650; } .post .nm.me { color: #ff7fb3; } .post .ok { color: #59a6ff; font-size: 11px; }
  .post .hd { color: var(--muted); font-size: 11px; }
  .pic { background: linear-gradient(135deg, #1c3f8f, #0b1530 60%, #4a1236); }
  .pic.match { display: flex; align-items: center; justify-content: space-around; padding: 22px 8px; }
  .pic .side { text-align: center; width: 30%; } .pic .crest { width: 64px; height: 64px; object-fit: contain; }
  .pic .crest.blank { display: inline-block; border-radius: 50%; background: #ffffff18; }
  .pic .tn { margin-top: 6px; font-weight: 650; font-size: 13px; }
  .pic .mid { text-align: center; } .pic .sc { font-size: 34px; font-weight: 800; letter-spacing: 2px; }
  .pic .cp { color: #c9d4f0; font-size: 11px; margin-top: 4px; }
  .pic.gfx { position: relative; overflow: hidden; padding: 18px 16px; min-height: 170px; }
  .pic .tag { display: inline-block; font-size: 11px; letter-spacing: .12em; font-weight: 700; color: #ffd0e4; text-transform: uppercase; }
  .pic.result { text-align: center; } .pic.result .row3 { display: flex; align-items: center; justify-content: space-around; margin: 10px 0 6px; }
  .pic.result .sc { font-size: 38px; font-weight: 800; letter-spacing: 2px; }
  .pic .scorers { color: #e6ecff; font-size: 12px; margin: 4px 0; }
  .pic.motm, .pic.stat { display: flex; align-items: center; gap: 14px; }
  .pic .txt { flex: 1; z-index: 1; } .pic .big { font-size: 18px; font-weight: 750; margin-top: 4px; }
  .pic .num { font-size: 46px; font-weight: 850; line-height: 1.05; color: #fff; text-shadow: 0 2px 12px #0008; }
  .pic .chips { color: #c9d4f0; font-size: 12px; margin-top: 4px; }
  .pic .ring { width: 104px; height: 104px; border-radius: 50%; overflow: hidden; flex: none; z-index: 1;
               background: radial-gradient(circle at 50% 35%, #ffffff33, #ffffff08); border: 3px solid #ffffff55; }
  .pic .mface { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .pic .wm { position: absolute; right: -18px; bottom: -18px; width: 120px; height: 120px; opacity: .12; object-fit: contain; }
  .pic.quote .qmark { font-size: 60px; line-height: .6; color: #ff7fb3; } .pic.quote .qt { font-size: 17px; font-weight: 650; margin: 6px 0 10px; z-index: 1; position: relative; }
  .pic.quote .by { color: #c9d4f0; font-size: 12px; }
  .pic.portrait { display: flex; justify-content: center; align-items: flex-end; height: 220px; }
  .pic .face { height: 210px; } .pic .biglogo { height: 150px; margin: auto; object-fit: contain; }
  .post .act { display: flex; gap: 16px; padding: 8px 11px 0; color: var(--muted); font-size: 13px; }
  .post .act button { background: none; border: 0; color: var(--muted); padding: 0; }
  .post .cap { padding: 6px 11px 0; white-space: pre-wrap; }
  .cmts { padding: 4px 11px 10px; }
  .cm { margin-top: 7px; font-size: 13px; white-space: pre-wrap; } .cm.at { background: #d6246e1a; border-radius: 6px; padding: 3px 5px; }
  .cm .to { color: #9fc0ff; } .cact { display: flex; gap: 12px; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .cact button, .cmts .more { background: none; border: 0; color: var(--muted); padding: 0; font-size: 11px; }
  .cmts .more { margin-top: 8px; }
  .compose { display: flex; gap: 8px; margin: 8px 11px 10px; }
  .compose button { border: 0; border-radius: 8px; padding: 0 14px; background: var(--accent); color: #fff; font-weight: 650; flex: none; }
  .notes { margin: 8px 12px; padding: 8px 10px; border-radius: 10px; background: #2a1530; border: 1px solid #d6246e55; font-size: 13px; }
  .note { margin: 4px 0; }
  .moodbar { margin: 8px 14px 0; color: var(--muted); font-size: 12px; }
  .card { margin: 8px 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .card .meta { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .card .head { font-weight: 650; }
  .card .body { color: #c7d0e4; font-size: 13px; margin-top: 4px; white-space: pre-wrap; display: -webkit-box;
                -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .card .body.open { display: block; }
  .score { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; }
  .score .team { flex: 1; } .score .team.r { text-align: right; }
  .score .num { font-size: 18px; padding: 0 6px; }
  .card.win { border-left: 3px solid var(--good); } .card.loss { border-left: 3px solid var(--bad); } .card.draw { border-left: 3px solid var(--warn); }
  .link { color: #9fc0ff; cursor: pointer; } .link:hover { text-decoration: underline; }
  .chips { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .filter { display: flex; justify-content: flex-end; padding: 8px 14px 0; }
  .filter button { background: none; border: 0; color: var(--muted); font-size: 12px; text-decoration: underline; }
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="back" hidden>‹</button>
  <div class="title" id="title"></div>
  <div class="tabs">
    <button class="tab" id="tab-home"></button>
    <button class="tab" id="tab-feed"></button>
    <button class="tab" id="tab-social"></button>
    <button class="tab" id="tab-settings"></button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="main"></main>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const T = {
  zh: { phone: "主教练手机", messages: "消息", social: "社交", postPh: "发一条…", post: "发布", reply: "回复", replyPh: "回复…",
        refreshing: "大家正在发帖…", answersLater: "已发出。回复会在之后几个小时里陆续出现。", fullTime: "全场结束", motm: "全场最佳", apps: "出场", matchday: "比赛日", odds: "赔率", homeWin: "主胜", draw: "平", awayWin: "客胜", allComments: "查看全部 N 条评论",
        notifications: "通知", repliedYou: "回复了你", mentionedYou: "提到了你", fanMood: "球迷对你的情绪", noPosts: "还没有帖子。比赛和新闻之后大家会在这里发帖。", sending: "发送中…", inbox: "新消息", opening: "正在打开…", journalist: "记者", press: "新闻发布会", pressWait: "记者正在组织问题…", pressPlaceholder: "直接回答记者…",
        pressNative: "用 FM 原版选项回答这题", pressSent: "已作为 FM 回答提交：", followLeft: "记者还能追问", pressThinking: "记者在记笔记…", pressNext: "等待下一个问题…", feed: "动态", noFeed: "还没有动态。推进一天或踢完一场比赛后会出现。",
        potm: "全场最佳", scorers: "进球", showAll: "显示全部收件箱", showImportant: "只看重要的", results: { "赢了": "胜", "输了": "负", "打平": "平" }, settings: "设置", recent: "最近聊天", squad: "一线队",
        noRecent: "还没有聊过天。点下面任何一名球员开始。", placeholder: "输入消息…", send: "发送",
        typing: "正在输入…", failed: "没发出去", retry: "重发", typingSpoken: "正在想怎么回答…", fmTalk: "FM 谈话",
        moods: { happy: "心情不错", neutral: "神色平静", worried: "有些担心", annoyed: "有点不耐烦", angry: "明显不高兴", sad: "有些失落", excited: "很兴奋" },
        language: "界面语言", model: "模型", provider: "提供方", apiKey: "API key", keySaved: "已保存", keyKeep: "留空则保留已保存的 key",
        keyNone: "这个选项不需要 key；粘贴别家的 key 会自动切换", pickProvider: "请在上面选这个 key 属于哪家", baseUrl: "接口地址", modelName: "模型名称", fetchModels: "获取模型列表",
        test: "测试连接", save: "保存", saved: "已保存", testing: "测试中…", testOk: "连接成功", detected: "已识别为",
        noBridge: "还没读入生涯。读入存档后这里会显示你的球队。", noEngine: "连不上引擎。", modelErr: "模型出错：",
        loading: "加载中…", keyPrivacy: "key 只保存在这台电脑上，只发给你选的提供方。" },
  en: { phone: "Manager's phone", messages: "Messages", social: "Social", postPh: "Post something…", post: "Post", reply: "Reply", replyPh: "Reply…",
        refreshing: "People are posting…", answersLater: "Sent. Answers will come in over the next few hours.", fullTime: "Full time", motm: "Player of the match", apps: "Apps", matchday: "Matchday", odds: "Odds", homeWin: "Home", draw: "Draw", awayWin: "Away", allComments: "View all N comments",
        notifications: "Notifications", repliedYou: "replied to you", mentionedYou: "mentioned you", fanMood: "Supporters' mood", noPosts: "No posts yet. People post here after matches and news.", sending: "Sending…", inbox: "New messages", opening: "Opening…", journalist: "Journalist", press: "Press conference", pressWait: "The journalist is preparing the question…", pressPlaceholder: "Answer the journalist…",
        pressNative: "Answer this one with FM's options", pressSent: "Submitted to FM as: ", followLeft: "Follow-ups left", pressThinking: "The journalist is taking notes…", pressNext: "Waiting for the next question…", feed: "Feed", noFeed: "Nothing yet. Stories appear as days pass and matches are played.",
        potm: "Player of the match", scorers: "Goals", showAll: "Show whole inbox", showImportant: "Important only", results: { "赢了": "W", "输了": "L", "打平": "D" }, settings: "Settings", recent: "Recent", squad: "First team",
        noRecent: "No conversations yet. Pick any player below to start.", placeholder: "Type a message…", send: "Send",
        typing: "typing…", failed: "Not sent", retry: "Retry", typingSpoken: "is thinking…", fmTalk: "FM conversation",
        moods: { happy: "In good spirits", neutral: "Calm", worried: "A little worried", annoyed: "A bit impatient", angry: "Clearly unhappy", sad: "Downcast", excited: "Excited" },
        language: "Language", model: "Model", provider: "Provider", apiKey: "API key", keySaved: "Saved", keyKeep: "Leave empty to keep the saved key",
        keyNone: "No key needed (paste a key to switch)", pickProvider: "Choose which provider this key belongs to above", baseUrl: "API address", modelName: "Model", fetchModels: "List models",
        test: "Test connection", save: "Save", saved: "Saved", testing: "Testing…", testOk: "Connected", detected: "Recognised as",
        noBridge: "No career loaded yet. Load a save and your team appears here.", noEngine: "Cannot reach the engine.", modelErr: "Model error: ",
        loading: "Loading…", keyPrivacy: "Your key stays on this computer and is only sent to the provider you choose." },
};
let lang = "zh", view = "home", current = null, providers = {}, settings = {};
const t = k => (T[lang] || T.zh)[k] || k;
const $ = id => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

async function api(path, body) {
  const opts = { headers: { "X-Token": TOKEN } };
  if (body !== undefined) { opts.method = "POST"; opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  let res;
  try { res = await fetch(path, opts); } catch (e) { throw Object.assign(new Error(t("noEngine")), { code: "engine" }); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { code: data.code, status: res.status });
  return data;
}

function avatar(p, big) {
  const cls = "avatar" + (big ? " big" : "");
  const initials = (p.name || "?").replace(/\s+/g, "").slice(0, big ? 2 : 1);
  if (p.uid && p.has_face !== false) {
    const img = el("img", { class: cls, src: `/face/${p.uid}?token=${encodeURIComponent(TOKEN)}`, alt: "" });
    img.onerror = () => img.replaceWith(el("div", { class: cls }, initials));
    return img;
  }
  return el("div", { class: cls }, initials);
}

function banner(text, isErr) {
  const b = $("banner");
  b.hidden = !text; b.textContent = text || ""; b.className = "banner" + (isErr ? " err" : "");
}

let unreadCount = 0;
function setUnread(n) {
  unreadCount = n || 0;
  const tab = $("tab-home"); tab.textContent = t("messages");
  if (unreadCount) tab.append(el("span", { class: "badge" }, String(unreadCount)));
}

function setHeader(title, showBack) {
  document.body.classList.toggle("pressmode", view === "press");
  $("title").textContent = title;
  $("back").hidden = !showBack;
  setUnread(unreadCount); $("tab-settings").textContent = t("settings"); $("tab-feed").textContent = t("feed");
  $("tab-feed").classList.toggle("on", view === "feed");
  setSocialBadge(socialCount); $("tab-social").classList.toggle("on", view === "social");
  $("tab-home").classList.toggle("on", view === "home" || view === "chat");
  $("tab-settings").classList.toggle("on", view === "settings");
  document.documentElement.lang = lang;
}

// --- home ----------------------------------------------------------------------
async function showHome() {
  view = "home"; current = null; setHeader(t("phone"), false);
  const main = $("main"); main.replaceChildren(el("div", { class: "empty" }, t("loading")));
  let data, inbox = { items: [], unread: 0 };
  try { [data, inbox] = await Promise.all([api("/api/contacts"), api("/api/inbox").catch(() => inbox)]); banner(""); }
  catch (e) { main.replaceChildren(el("div", { class: "empty" }, e.code === "bridge" ? t("noBridge") : e.message)); return; }
  if (view !== "home") return;
  setUnread(inbox.unread);
  const row = (p, sub) => el("div", { class: "person", onclick: () => openPerson(p.id) }, avatar(p),
    el("div", { class: "who" }, el("div", { class: "name" }, p.name), el("div", { class: "sub" }, sub)));
  const faces = Object.fromEntries(data.squad.map(p => [p.id, p.uid]));
  const contact = c => {
    const r = el("div", { class: "person" + (c.status === "unread" ? " unread" : "") },
      avatar({ name: c.name, uid: c.uid || faces[c.person] }),
      el("div", { class: "who" }, el("div", { class: "name" }, c.name + (c.role === "journalist" ? ` · ${t("journalist")}` : "")),
        el("div", { class: "sub" }, c.preview)));
    r.onclick = async () => {

  baseInput.oninput = () => { draft.base_url = baseInput.value.trim(); };
  modelInput.oninput = () => { draft.model = modelInput.value.trim(); };
  const body = () => ({ provider: draft.provider, model: draft.model || modelInput.value.trim(),
                        base_url: baseField.hidden ? "" : (draft.base_url || baseInput.value.trim()), api_key: draft.api_key });

  const fetchBtn = el("button", { class: "btn", type: "button", onclick: async () => {
    status.textContent = t("loading"); status.className = "hint";
    try { const r = await api("/api/models", body()); modelList.replaceChildren(...r.models.filter(Boolean).map(m => el("option", { value: m })));
      status.textContent = `${r.models.length} models`; }
    catch (e) { status.textContent = e.message; status.className = "hint bad"; } } }, t("fetchModels"));
  const testBtn = el("button", { class: "btn", type: "button", onclick: async () => {
    status.textContent = t("testing"); status.className = "hint";
    try { const r = await api("/api/test", body());
      status.textContent = r.ok ? t("testOk") : r.error; status.className = "hint " + (r.ok ? "ok" : "bad"); }
    catch (e) { status.textContent = e.message; status.className = "hint bad"; } } }, t("test"));
  const saveBtn = el("button", { class: "btn primary", type: "button", onclick: async () => {
    try { settings = await api("/api/settings", body()); draft.api_key = ""; keyInput.value = "";
      status.textContent = t("saved"); status.className = "hint ok"; refresh(); }
    catch (e) { status.textContent = e.message; status.className = "hint bad"; } } }, t("save"));

  refresh();
  $("main").replaceChildren(el("div", { class: "settings" },
    el("div", { class: "field" }, el("label", {}, t("language")), langSeg),
    el("div", { class: "section", style: "padding:14px 0 0" }, t("model")),
    el("div", { class: "field" }, el("label", {}, t("provider")), providerSel),
    el("div", { class: "field" }, el("label", {}, t("apiKey")), keyInput, keyHint),
    baseField,
    el("div", { class: "field" }, el("label", {}, t("modelName")), el("div", { class: "row" }, modelInput, fetchBtn), modelList),
    el("div", { class: "row", style: "margin-top:16px" }, testBtn, saveBtn),
    status));
}

// --- entry points (also called by the in-game overlay) ------------------------------
window.openPerson = openPerson;
window.openHome = showHome;
$("tab-home").onclick = showHome;
$("tab-settings").onclick = showSettings;
$("tab-feed").onclick = showFeed;
$("tab-social").onclick = () => showSocial();
window.openFeed = showFeed;
window.openPress = openPress;
$("back").onclick = showHome;

(async () => {
  try { const s = await api("/api/status"); lang = s.settings.language || "zh";
    if (!s.bridge) banner(t("noBridge")); }
  catch (e) { banner(e.message, true); }
  const badges = async () => { try { const s = await api("/api/press/active"); setUnread(s.messages); setSocialBadge(s.social); } catch (e) {} };
  badges(); setInterval(badges, 10000);
  const qs = new URLSearchParams(location.search), person = qs.get("person");
  if (qs.get("press")) openPress(); else if (person) openPerson(person); else showHome();
})();
</script>
</body>
